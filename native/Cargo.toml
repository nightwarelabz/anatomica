[package]
name = "anatomica-native"
version = "0.1.0"
edition = "2021"
description = "ANATOMICA native shell (flagship) — Rust + wgpu over the ANW1 Body Model packs. Milestone 7 skeleton: pack loading, orbit viewer, offscreen verification renderer."
license = "AGPL-3.0-only"

[[bin]]
name = "anatomica"
path = "src/main.rs"

[dependencies]
wgpu = "27.0.1"
winit = "0.30"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
debug = false
