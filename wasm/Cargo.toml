[package]
name = "anatomica-wasm"
version = "0.1.0"
edition = "2021"
description = "ANATOMICA wasm wrapper — the physiology engine and theatre runner compiled to WebAssembly for the browser build (access tier)."
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
anatomica-physiology = { path = "../physiology" }
anatomica-theatre = { path = "../theatre" }
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
lto = true
codegen-units = 1
