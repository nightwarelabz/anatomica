<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANATOMICA — Web Shell v2 (real geometry)</title>
<style>
  :root {
    --bg: #10141a; --panel: #171d26; --panel2: #1d2531; --line: #2b3646;
    --text: #d7dee8; --dim: #8b98a9; --accent: #ffb454; --warn: #e0a23c;
    --bad: #d9704f; --ok: #7fb069;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  #app { display: grid; grid-template-rows: 40px 1fr 30px; height: 100vh; }
  header { display: flex; align-items: center; gap: 14px; padding: 0 12px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  header .wordmark { font-weight: 700; letter-spacing: .14em; font-size: 14px; }
  header .sub { color: var(--dim); font-size: 12px; }
  header .spacer { flex: 1; }
  header label { color: var(--dim); font-size: 12px; display: flex; gap: 5px; align-items: center; cursor: pointer; }
  #main { display: grid; grid-template-columns: 300px 1fr 320px; min-height: 0; }
  aside { background: var(--panel); overflow-y: auto; padding: 10px; }
  #left { border-right: 1px solid var(--line); }
  #right { border-left: 1px solid var(--line); }
  #viewwrap { position: relative; min-width: 0; background: #0b0e13; }
  #gl, #labels { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #labels { pointer-events: none; }
  #status { position: absolute; left: 10px; top: 8px; color: var(--dim); font-size: 12px;
    text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre-line; }
  h3 { margin: 12px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); }
  h3:first-child { margin-top: 0; }
  input[type="search"], select { width: 100%; padding: 6px 8px; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 4px; color: var(--text); }
  .chk { display: flex; align-items: center; gap: 6px; margin: 4px 0; cursor: pointer; color: var(--text); }
  .chk .cnt { color: var(--dim); font-size: 11px; margin-left: auto; }
  #list { margin-top: 6px; }
  .lgroup { margin: 8px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
  .row { padding: 4px 7px; border-radius: 4px; cursor: pointer; display: flex; gap: 6px; align-items: baseline; }
  .row:hover { background: var(--panel2); }
  .row.sel { background: #2c3a4f; outline: 1px solid var(--accent); }
  .row .nm { flex: 1; }
  .badge { font-size: 10px; padding: 0 5px; border-radius: 8px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .badge.nogeo { color: var(--bad); border-color: var(--bad); }
  .badge.inv { color: var(--dim); }
  .badge.ver { color: var(--warn); border-color: var(--warn); }
  #panel h2 { margin: 0 0 2px; font-size: 16px; }
  #panel .ta { font-style: italic; color: var(--dim); margin-bottom: 8px; }
  #panel table { width: 100%; border-collapse: collapse; }
  #panel th { text-align: left; color: var(--dim); font-weight: 500; padding: 3px 6px 3px 0; vertical-align: top; width: 34%; }
  #panel td { padding: 3px 0; }
  #panel ul { margin: 2px 0 6px; padding-left: 16px; }
  #panel .verifybox { border: 1px solid var(--warn); border-radius: 4px; padding: 6px 8px; margin: 8px 0; }
  #panel .verifybox .vh { color: var(--warn); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  #panel .note { border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; color: var(--dim); margin: 8px 0; }
  #panel .empty { color: var(--dim); }
  footer { display: flex; align-items: center; gap: 16px; padding: 0 12px; background: var(--panel);
    border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; overflow-x: auto; white-space: nowrap; }
  footer b { color: var(--text); font-weight: 600; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 4px 9px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="wordmark">ANATOMICA</span>
    <span class="sub">web shell v2 — real assembled geometry (BodyParts3D 4.0, canonical frame, cm)</span>
    <span class="spacer"></span>
    <label><input type="checkbox" id="optLabels"> labels</label>
    <label><input type="checkbox" id="optWire"> wireframe</label>
    <label><input type="checkbox" id="optDim" checked> dim others on select</label>
    <button id="btnReset">reset view</button>
  </header>
  <div id="main">
    <aside id="left">
      <h3>Search</h3>
      <input type="search" id="search" placeholder="name, TA name, id…">
      <h3>Layers</h3>
      <label class="chk"><input type="checkbox" id="laySkel" checked> Skeleton <span class="cnt" id="cntSkel"></span></label>
      <label class="chk"><input type="checkbox" id="layMusc" checked> Muscles <span class="cnt" id="cntMusc"></span></label>
      <h3>Region filter</h3>
      <select id="regionSel"><option value="">All regions</option></select>
      <h3>Records</h3>
      <div id="list"></div>
    </aside>
    <div id="viewwrap">
      <canvas id="gl"></canvas>
      <canvas id="labels"></canvas>
      <div id="status">loading…</div>
    </div>
    <aside id="right"><div id="panel"><p class="empty">Select a structure — click a mesh in the view, or a row in the record list.</p></div></aside>
  </div>
  <footer id="strip"></footer>
</div>
<script src="viewer.js"></script>
</body>
</html>
